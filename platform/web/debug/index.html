<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victoria Sims — debug</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #0f1116;
        color: #d8dce6;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #262a35;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
    }
    h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.04em;
    }
    #statusLine {
        margin: 0.35rem 0 0;
        font-size: 0.8rem;
        color: #8b93a7;
    }
    #statusLine.statusError {
        color: #ff7a90;
    }
    header a {
        font-size: 0.8rem;
        color: #6fd3ff;
        text-decoration: none;
        white-space: nowrap;
    }
    header a:hover { text-decoration: underline; }
    #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    #victoriaCanvas {
        display: block;
    }
    #aspectLabel {
        position: absolute;
        left: 0.75rem;
        bottom: 0.75rem;
        padding: 0.3rem 0.6rem;
        background: rgba(9, 11, 15, 0.82);
        border: 1px solid #262a35;
        border-radius: 4px;
        font-size: 0.7rem;
        color: #8b93a7;
        pointer-events: none;
    }
    #resizePrompt {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(5, 6, 10, 0.88);
        text-align: center;
        cursor: pointer;
    }
    #resizePrompt p {
        margin: 0;
        font-size: 0.95rem;
    }
    #profilerPanel {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        padding: 0.6rem 0.75rem;
        background: rgba(9, 11, 15, 0.82);
        border: 1px solid #262a35;
        border-radius: 4px;
        pointer-events: none;
    }
    #profilerReport {
        margin: 0;
        font-size: 0.7rem;
        line-height: 1.45;
        color: #b9c0d0;
        white-space: pre;
        overflow-x: auto;
    }
    #profilerSparkline {
        display: block;
        width: 100%;
        height: 34px;
        margin-top: 0.5rem;
    }
</style>
</head>
<body>
<header>
    <div>
        <h1>Victoria Sims — debug build</h1>
        <p id="statusLine">Starting WebGPU&hellip;</p>
    </div>
    <a href="../">&larr; back to the game</a>
</header>
<div id="stage">
    <canvas id="victoriaCanvas"></canvas>
    <div id="profilerPanel">
        <pre id="profilerReport">profiler: waiting for first frame</pre>
        <canvas id="profilerSparkline"></canvas>
    </div>
    <div id="aspectLabel">aspect ratio: —</div>
    <div id="resizePrompt">
        <p>Window resized. Click to fit the closest aspect ratio.</p>
    </div>
</div>
<script src="victoriaRuntime.js"></script>
<div id="discZone">
    <p>Drop a Sims&nbsp;2 disc image here to draw something off it.</p>
    <label class="fileButton">
        Choose an ISO
        <input type="file" id="discInput" accept=".iso,application/x-iso9660-image">
    </label>
    <p id="discStatus">No disc. Showing the placeholder.</p>
</div>
<style>
    #discZone {
        margin: 1rem;
        padding: 1rem;
        border: 1px dashed #39405280;
        border-radius: 6px;
        font: 0.82rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #8b93a7;
        text-align: center;
    }
    #discZone.isHot { border-color: #6fd3ff; background: #6fd3ff10; }
    #discZone p { margin: 0 0 0.6rem; }
    #discStatus { margin: 0.6rem 0 0; }
    label.fileButton {
        display: inline-block;
        background: #1b2029;
        color: #d8dce6;
        border: 1px solid #333a49;
        border-radius: 4px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
    }
    label.fileButton:hover { border-color: #6fd3ff; }
    #discZone input[type=file] { display: none; }
</style>
</body>
</html>
