name: clean workflow runs

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: dmvict/clean-workflow-runs@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          save_period: 30
          save_min_runs_number: 5
